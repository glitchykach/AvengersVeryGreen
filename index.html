<style>

const K='glitchyrank.v1',td=()=>new Date().toISOString().slice(0,10),fa=n=>(+n||0).toLocaleString('fa-IR',{maximumFractionDigits:1}),pn=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function demo(){const t=td(),ch=a=>a.map(n=>({id:uid(),name:n,done:0}));return{demo:1,profile:{name:'کاوه',grade:'یازدهم ریاضی',score:4000,start:4000,target:10000,cap:120},

function form(title,fs,v,cb){v=v||{};modal(`<h3>${title}</h3><div id=fe class=err></div>${fs.map(f=>`<label>${f.l}${f.t=='select'?`<select id=f_${f.k}>${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==v[f.k]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea id=f_${f.k} rows=3>${esc(v[f.k])}</textarea>`:`<input id=f_${f.k} type=${f.t||'text'} value="${esc(v[f.k])}" ${f.t=='number'?'dir=ltr step=any':''}>`}</label>`).join('')}<div class=row><button class="btn pr" onclick=sub()>ذخیره</button><button class=btn onclick=cls()>انصراف</button></div>`);
window.sub=()=>{const o={};for(const f of fs){let x=$('f_'+f.k).value.trim();if(f.req&&!x)return fe(`«${f.l}» الزامی است`);if(f.t=='number'&&x!==''){x=+x;if(isNaN(x)||x<f.min||x>f.max)return fe(`«${f.l}» باید بین ${fa(f.min)} و ${fa(f.max)} باشد`)}o[f.k]=x}const er=cb(o);if(er)return fe(er);cls();R();toast('ذخیره شد')}}
const sco=()=>S.subjects.flatMap(s=>[[s.id+'|',s.name+' (عمومی)'],...s.chapters.map(c=>[s.id+'|'+c.name,s.name+' › '+c.name])]),dayMin=(d,ex)=>sum(S.tasks.filter(t=>t.date==d&&t.id!=ex).map(t=>+t.dur));

function stats(){const dd=S.tasks.filter(x=>x.done),days=new Set([...dd.map(x=>x.date),...S.sessions.map(x=>x.date),...S.exams.map(x=>x.date)]),rv=S.errors.filter(e=>e.n>0).length,ex=[...S.exams].sort((a,b)=>a.date<b.date?-1:1),imp=ex.length>1&&acc(ex.at(-1))>acc(ex.at(-2))?40:0;
const xp=Math.round(dd.length*10+sum(S.sessions.map(s=>Math.min(s.min,120)))/6+S.exams.length*25+rv*5+days.size*8+imp);let L=0;TH.forEach((x,i)=>{if(xp>=x)L=i});return{xp,L,days:days.size,rv,imp,ex}}
function wk(){return S.subjects.map(s=>{const oe=S.errors.filter(e=>e.subj==s.id&&e.status!='mastered').length,ps=S.exams.map(e=>e.subs?.[s.id]).filter(x=>x!==''&&x!=null),av=ps.length?sum(ps)/ps.length:null,why=[`خودارزیابی ${fa(s.prof)} از ۵`];let sc=(6-s.prof)*2+(4-s.prio)*1.5+oe;if(oe)why.push(`${fa(oe)} خطای باز در دفترچه`);if(av!=null){why.push(`میانگین درصد آزمون‌ها ${fa(av)}`);if(av<60)sc+=(60-av)/10}return{s,sc,why,oe,av}}).sort((a,b)=>b.sc-a.sc)}
const chp=s=>s.chapters.filter(c=>!c.done).map(c=>({c,e:S.errors.filter(x=>x.subj==s.id&&x.ch==c.name&&x.status!='mastered').length})).sort((a,b)=>b.e-a.e);

const MSG=['یک قدم کوچک امروز، از یک روز طولانی فردا مهم‌تر است.','اشتباه‌ها نقشهٔ راه تو هستند؛ فقط باید خوانده شوند.','ثبات از شدت مهم‌تر است. استراحت هم بخشی از برنامه است.','فیزیک را با مسئله‌های کوتاه و مرتب جلو ببر.','پیشرفت یعنی امروز کمی بهتر از دیروز.'];

function ef(id){const e=S.errors.find(x=>x.id==id)||{};form(id?'ویرایش خطا':'ثبت خطا',[{k:'sc',l:'درس › فصل',t:'select',o:sco()},{k:'topic',l:'مبحث',req:1},{k:'kind',l:'نوع',t:'select',o:[['w','غلط'],['u','نزده']]},{k:'type',l:'نوع خطا',t:'select',o:Object.entries(ET)},{k:'why',l:'توضیح اشتباه',t:'textarea',req:1},{k:'sol',l:'راه‌حل درست',t:'textarea'},{k:'review',l:'تاریخ مرور',t:'date',req:1},{k:'status',l:'وضعیت',t:'select',o:[['new','جدید'],['review','در مرور'],['mastered','مسلط']]}],id?{...e,sc:e.subj+'|'+e.ch}:{sc:sco()[1]?.[0],kind:'w',type:'conc',review:addD(td(),1),status:'new'},o=>{const[s,c]=o.sc.split('|'),n={id:id||uid(),subj:s,ch:c,topic:o.topic,kind:o.kind,type:o.type,why:o.why,sol:o.sol,review:o.review,status:o.status,n:e.n||0,rep:e.rep||0,added:e.added||td()};id?Object.assign(e,n):S.errors.push(n)})}
function rv(id,ok){const e=S.errors.find(x=>x.id==id),iv=[1,3,7,14];if(ok){e.n++;e.review=addD(td(),iv[Math.min(e.n-1,3)]);e.status=e.n>=4?'mastered':'review'}else{e.rep=(e.rep||0)+1;e.review=addD(td(),1);e.status='review'}R()}
function sf(id){const s=sj(id)||{};form(id?'ویرایش درس':'درس جدید',[{k:'name',l:'نام درس',req:1},{k:'prof',l:'خودارزیابی (۱ تا ۵)',t:'number',req:1,min:1,max:5},{k:'prio',l:'اولویت (۱ بالاترین)',t:'number',req:1,min:1,max:20},{k:'wk',l:'ساعت هفتگی',t:'number',req:1,min:0,max:60}],id?s:{prof:3,prio:S.subjects.length+1,wk:3},o=>{const n={name:o.name,prof:o.prof,prio:o.prio,wk:o.wk};id?Object.assign(s,n):S.subjects.push({id:uid(),...n,chapters:[],notes:'',last:''})})}

const pf=()=>form('ویرایش پروفایل',[{k:'name',l:'نام',req:1},{k:'grade',l:'پایه و رشته'},{k:'score',l:'تراز فعلی',t:'number',req:1,min:0,max:15000},{k:'target',l:'تراز هدف',t:'number',req:1,min:1,max:15000},{k:'cap',l:'ظرفیت روزانه (دقیقه)',t:'number',req:1,min:10,max:600}],S.profile,o=>{if(o.target<=S.profile.start)return 'هدف باید از تراز شروع بیشتر باشد.';Object.assign(S.profile,o)});
function cp(s){try{navigator.clipboard.writeText(s).then(()=>toast('کپی شد'),()=>toast('کپی ممکن نبود؛ متن را دستی انتخاب کن',1))}catch(e){toast('کپی ممکن نبود',1)}}
function dl(n,s){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/plain'}));a.download=n;a.click();toast('دانلود درخواست شد؛ اگر شروع نشد از «کپی» استفاده کن')}catch(e){toast('دانلود ممکن نبود',1)}}
const ex=()=>{modal(`<h3>خروجی پشتیبان</h3><textarea id=jx rows=8 dir=ltr readonly>${esc(JSON.stringify(S))}</textarea><div class=row><button class="btn pr" onclick="cp($('jx').value)">کپی</button><button class=btn onclick="dl('glitchy-backup.json',$('jx').value)">دانلود</button><button class=btn onclick=cls()>بستن</button></div>`)};
const im=()=>{modal(`<h3>ورودی پشتیبان</h3><div id=fe class=err></div><input type=file accept=.json onchange="const r=new FileReader();r.onload=()=>$('ji').value=r.result;r.readAsText(this.files[0])"><textarea id=ji rows=7 dir=ltr placeholder="JSON را اینجا بچسبان"></textarea><div class=row><button class="btn pr" onclick=doim()>جایگزینی داده‌ها</button><button class=btn onclick=cls()>انصراف</button></div>`)};
function doim(){try{const v=JSON.parse($('ji').value);if(!v||!Array.isArray(v.subjects)||!Array.isArray(v.tasks)||!Array.isArray(v.exams)||!Array.isArray(v.errors)||!Array.isArray(v.sessions)||!v.profile)throw 0;ask('داده‌های فعلی با پشتیبان جایگزین شوند؟',()=>{S=v});}catch(e){fe('فایل معتبر نیست. ساختار پشتیبان گلیچی رنک لازم است.')}}
function rep(){const t=td(),ws=addD(t,-6),inW=d=>d>=ws&&d<=t,tk=S.tasks.filter(x=>inW(x.date)),ss=S.sessions.filter(x=>inW(x.date)),ex=S.exams.filter(x=>inW(x.date)),by={};S.errors.filter(e=>e.status!='mastered').forEach(e=>by[e.type]=(by[e.type]||0)+1);const all=[...S.exams].sort((a,b)=>a.date<b.date?-1:1),a=all.at(-1),b=all.at(-2),w=wk();
return `گزارش هفتگی ${S.profile.name} — ${fd(ws)} تا ${fd(t)}\n\nزمان تمرکز: ${fa(sum(ss.map(x=>x.min)))} دقیقه\nکارها: ${fa(tk.filter(x=>x.done).length)} انجام‌شده از ${fa(tk.length)} برنامه‌ریزی‌شده\n\nتغییر درصد درس‌ها (آخرین آزمون نسبت به قبلی):\n${S.subjects.map(s=>{const x=a?.subs?.[s.id],y=b?.subs?.[s.id];return `- ${s.name}: ${x===''||x==null?'—':y===''||y==null?fa(x)+' (مقایسه ممکن نیست)':fa(x-y)+' واحد'}`}).join('\n')}\n\nآزمون‌های این هفته: ${fa(ex.length)}${ex.length?'\n'+ex.map(e=>`- ${e.name}: ${fa(acc(e))}٪ صحیح`).join('\n'):''}\n\nپرتکرارترین خطاها: ${Object.entries(by).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([k,v])=>`${ET[k]} (${fa(v)})`).join('، ')||'—'}\n\nسه اولویت هفتهٔ بعد:\n۱. ${w[0]?w[0].s.name+(chp(w[0].s)[0]?' › '+chp(w[0].s)[0].c.name:''):'—'}\n۲. مرور ${fa(queue().filter(x=>x.e.review<=t).length)} خطای موعددار\n۳. ${w[1]?w[1].s.name+': یک جلسهٔ منظم':'حفظ ثبات'}`}
draw();
